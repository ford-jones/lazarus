name: Changelog CI
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'
      tags:
        description: 'Test scenario tags'  
        
  push:
    branches:
      - 'main'

jobs:
  create-changelog:
    permissions:
      contents: 'write'  
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Cleanup previous output
        run: |
          git rm -f .github/changelogs/latest.md && rm -rf .github/changelogs/latest.md && git commit -m "Clean: Remove previous changelog"
      - name: Set current date as env variable
        id: date
        run: |
          echo "::set-output name=date::$(date +'%Y.%m.%d%H%M%S')"
      - name: Run Changelog CI
        uses: saadmk11/changelog-ci@v2.0.2
        with:
          release_version: ${{ steps.date.outputs.date }}
          committer_username: ${{ github.actor }}
          config_file: .github/changelogs/config.json
          changelog_filename: .github/changelogs/latest.md
        id: changelog-ci
      - run: |
          echo "${{ steps.changelog-ci.outputs.changelog }}"
